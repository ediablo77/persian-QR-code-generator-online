                                </div>
                            </div>

                                </div>
                            </div>
                            <div id="phoneModeForm" style="display: none;">
                                <div class="mb-4">
                                    <label class="form-label" for="phoneData">📱 شماره تلفن</label>

                                </div>
                            </div>
                            <div id="whatsappModeForm" style="display: none;">

                                    <label class="form-label" for="whatsappNumber">💬 شماره واتساپ</label>
                                    <input type="tel" class="form-control" id="whatsappNumber" placeholder="مثال : 989123456789">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="whatsappMessage">✏️ متن پیام (اختیاری)</label>
                                    <input type="text" class="form-control" id="whatsappMessage" placeholder="متن پیام...">
                                </div>
                            </div>
                            <div id="wifiModeForm" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label" for="wifiSsid">📡 نام شبکه (SSID)</label>
                                    <input type="text" class="form-control" id="wifiSsid" placeholder="نام وایفای">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="wifiPassword">🔑 رمز عبور</label>
                                    <input type="text" class="form-control" id="wifiPassword" placeholder="رمز وایفای">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="wifiEncryption">🛡️ نوع رمزگذاری</label>
                                    <select class="form-select" id="wifiEncryption">
                                        <option value="WPA">WPA/WPA2</option>
                                        <option value="WEP">WEP</option>
                                        <option value="nopass">بدون رمز</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- کنترل اندازه -->
                        <div class="size-control">
                            <label class="form-label d-flex justify-content-between">
                                <span>📏 اندازه QR کد (پیکسل)</span>
                                <span id="sizeValue" class="badge bg-primary rounded-pill">300</span>
                            </label>
                            <input type="range" class="form-range" id="qrSizeSlider" min="150" max="600" step="10" value="300" aria-label="تنظیم اندازه کیو آر کد">
                            <div class="form-text text-muted small">👉 اسلایدر را حرکت دهید تا اندازه کیوآر کد تغییر کند</div>

<div class="footer-note">
